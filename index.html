<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060709">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Midnight Sudoku</title>
<style>
:root {
  --bg: #060709;
  --text: #F5F5F7;
  --text2: #A1A1AA;
  --text3: #8B8B95;
  --glass: rgba(255, 255, 255, 0.055);
  --line: rgba(255, 255, 255, 0.09);
  --red: #FF6B6B;
  --ink: #0A0B1A;
  --cell: #0C0D12;
  --cell-rel: #15171F;
  --accent: #F5F5F7;
  --accent-soft: #2B2B2D;
  --accent-tile: #232325;
  --accent-text: #FFFFFF;
  --accent-line: #77777A;
  --same: #3C3C3F;
  --flash: #66666A;
  --mine: #9AA3B2;
  --knob-on: #0A0B1A;
  --wrong-bg: #2D1619;
  --win-mine-bg: #313134;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 13px; color: var(--text2); margin: 0; }

/* ambient glow */
.glow { position: fixed; border-radius: 50%; background: var(--accent); filter: blur(100px); pointer-events: none; transition: opacity .5s, top .7s cubic-bezier(.2,.8,.2,1), background-color .4s; }
#glowA { width: 440px; height: 440px; top: -170px; left: calc(50% - 285px); opacity: .2; }
#glowB { width: 320px; height: 320px; top: 62%; left: calc(50% + 35px); opacity: .09; }
body[data-screen="game"] #glowA { top: 14vh; opacity: .14; }
body[data-screen="game"] #glowB { opacity: 0; }
body[data-screen="win"] #glowA { top: 0; opacity: .24; }
body.noglow .glow { opacity: 0 !important; }

/* screens */
.screen {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; width: min(100%, 480px);
  display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 10px) 20px calc(var(--safe-b) + 14px);
}
.screen.enter { animation: enter .38s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.glass { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); }
.round-btn { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s; }
.round-btn:active, .pill:active, .level:active, .continue:active, .key:active, .sheet-item:active { transform: scale(.95); }
.primary { width: 100%; height: 58px; border-radius: 20px; background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; transition: transform .15s, background-color .3s; flex-shrink: 0; }
.primary:active { transform: scale(.97); }
.secondary { width: 100%; height: 54px; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; flex-shrink: 0; }
.secondary:disabled { color: var(--text2); }
.chip { align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }

.bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; }
.bars i { width: 4px; border-radius: 2px; background: rgba(255,255,255,.14); }
.bars i.on { background: var(--accent); }
.bars.sm { gap: 2px; height: 14px; }
.bars.sm i { width: 3px; }

/* home */
.brand { height: 44px; display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 15px; font-weight: 500; flex-shrink: 0; }
.logo { width: 20px; height: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.logo i { background: rgba(255,255,255,.18); border-radius: 2px; }
.logo i:nth-child(5) { background: var(--accent); }
.title { margin: 2px 0 0; font-size: 40px; line-height: 1.08; font-weight: 700; letter-spacing: -.04em; flex-shrink: 0; }
.tab-panel { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; margin: 0 -20px; padding: 18px 20px 4px; }
.panel-body { flex: 1; display: flex; flex-direction: column; }
.panel-foot { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 12px; padding: 0 4px; }
.section-h.first { margin-top: 4px; }
.section-h h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }

.continue { width: 100%; display: flex; align-items: center; gap: 18px; padding: 18px; border-radius: 28px; text-align: left; transition: transform .15s; }
.cont-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.cont-level { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.cont-meta { display: block; margin-top: 4px; font-size: 13px; color: var(--text2); }
.progress { display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.mini { width: 104px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.mini .bx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
.mini i { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,.07); }
.mini i.g { background: rgba(255,255,255,.34); }
.mini i.m { background: var(--accent); }

.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.level { height: 100px; padding: 16px; border-radius: 24px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; transition: transform .15s, border-color .2s, background-color .2s; }
.level[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tile); }
.level-top { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
.check { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--ink); display: none; align-items: center; justify-content: center; }
.level[aria-pressed="true"] .check { display: flex; }
.level-name { display: flex; flex-direction: column; gap: 3px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.level-name small { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--text2); }

.tabbar { margin-top: 12px; height: 64px; padding: 6px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex-shrink: 0; }
.tabbar button { border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--text2); transition: background-color .2s, color .2s; }
.tabbar button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

/* daily */
.daily-card { padding: 22px; border-radius: 28px; display: flex; flex-direction: column; gap: 6px; }
.daily-day { margin-top: 10px; font-size: 15px; color: var(--text2); }
.daily-date { font-size: 32px; font-weight: 700; letter-spacing: -.04em; }
.daily-card .label { margin-top: 6px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); padding: 14px 6px; border-radius: 24px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.day small { font-size: 11px; color: var(--text2); }
.day b { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.today b { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.done b { background: var(--accent); color: var(--ink); }

/* stats */
.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-size: 24px; font-weight: 500; }
.tile span { font-size: 12px; color: var(--text2); }
.group { border-radius: 22px; overflow: hidden; }
.srow { display: grid; grid-template-columns: 1fr 50px 58px 58px; align-items: center; gap: 8px; min-height: 54px; padding: 0 16px; }
.srow + .srow { border-top: 1px solid rgba(255,255,255,.07); }
.srow.head { min-height: 36px; font-size: 11px; color: var(--text2); }
.srow.head span, .srow b { text-align: right; }
.srow b { font-size: 14px; font-weight: 500; }
.sname { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }

/* settings */
.row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 18px; font-size: 16px; text-align: left; }
.row + .row { border-top: 1px solid rgba(255,255,255,.07); }
.row-text { display: flex; flex-direction: column; gap: 2px; }
.row-text small { font-size: 12px; color: var(--text2); }
.row.danger { color: var(--red); font-weight: 500; }
.swatches { display: flex; gap: 2px; }
.swatch { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.swatch[aria-checked="true"] i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.switch { width: 51px; height: 31px; border-radius: 16px; background: rgba(255,255,255,.16); position: relative; flex-shrink: 0; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s, background-color .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--knob-on); }
.about { margin: 20px 4px 8px; font-size: 12px; line-height: 1.5; color: var(--text3); }

/* game */
.topbar { height: 44px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.pill { height: 44px; padding: 0 16px 0 18px; border-radius: 22px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; transition: transform .15s; }
.statbar { margin-top: 14px; height: 58px; border-radius: 20px; display: grid; grid-template-columns: repeat(3, 1fr); flex-shrink: 0; }
.statbar > div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.statbar > div + div { border-left: 1px solid rgba(255,255,255,.08); }
.statbar b { font-size: 17px; font-weight: 500; }
.statbar b.bad { color: var(--red); }
.statbar span { font-size: 11px; color: var(--text2); }
.board-wrap {
  position: relative; align-self: center; margin-top: 14px; flex-shrink: 0; container-type: inline-size;
  width: min(100%, calc(100vh - var(--safe-t) - var(--safe-b) - 392px));
  width: min(100%, calc(100dvh - var(--safe-t) - var(--safe-b) - 392px));
}
.board { aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.2); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 2px; }
.box { min-width: 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 1px; background: rgba(255,255,255,.07); }
.cell { position: relative; min-width: 0; min-height: 0; background: var(--cell); color: var(--mine); display: flex; align-items: center; justify-content: center; font-size: 6.4cqw; font-weight: 600; transition: background-color .12s; }
.cell.given { color: var(--text); font-weight: 500; }
.cell.wrong { color: var(--red); }
.cell.rel { background: var(--cell-rel); }
.cell.same { background: var(--same); }
.cell.wrongbg { background: var(--wrong-bg); }
.cell.sel { background: var(--accent); color: var(--ink); }
.cell.sel.wrong { background: var(--red); color: var(--ink); }
.cell .v { display: block; line-height: 1; }
.notes { position: absolute; inset: 7%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-family: var(--mono); font-size: 2.5cqw; font-weight: 500; color: var(--text3); }
.notes span { display: flex; align-items: center; justify-content: center; }
.notes span.hl { color: var(--accent); }
.cell.sel .notes span { color: var(--ink); }
.cell.pop .v { animation: pop .28s ease; }
@keyframes pop { 0% { transform: scale(.5); opacity: .2; } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.cell.flash { animation: flash .75s ease both; }
@keyframes flash { 0% { background: var(--cell); } 35% { background: var(--flash); } 100% { background: var(--cell); } }
.overlay { position: absolute; inset: 0; border-radius: 22px; background: rgba(6,7,9,.74); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; animation: fade .2s; }
.overlay h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.04em; }
.overlay .big { font-size: 44px; font-weight: 500; letter-spacing: -.02em; }
.overlay .btn { height: 50px; padding: 0 28px; border-radius: 25px; background: var(--accent); color: var(--ink); font-size: 16px; font-weight: 600; }
.overlay .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); }
.overlay-actions { display: flex; gap: 10px; margin-top: 6px; }
.context { margin: 12px 0 0; min-height: 18px; text-align: center; font-size: 13px; color: var(--text2); flex-shrink: 0; }
.tools { margin-top: auto; height: 62px; padding: 6px; border-radius: 31px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex-shrink: 0; }
.tools button { position: relative; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #E4E4E7; transition: background-color .2s; }
.tools button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.tools button:disabled { opacity: .4; }
.badge { position: absolute; top: 3px; right: calc(50% - 26px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.pad { margin-top: 10px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; flex-shrink: 0; }
.key { height: clamp(52px, 8.2vh, 70px); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .12s, opacity .2s, border-color .2s; }
.key b { font-size: 26px; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
.key small { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.key.done { opacity: .28; pointer-events: none; }
.pad.notes .key { border-color: var(--accent-line); }
.pad.notes .key b { font-size: 20px; color: var(--accent); }

/* win */
.win-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; margin: 0 -20px; padding: 0 20px; }
.win-card { align-self: center; margin-top: 14px; padding: 12px; border-radius: 30px; }
.wb { width: min(204px, 52vw); aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.18); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 2px; container-type: inline-size; }
.wb .bx { min-width: 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 1px; background: rgba(255,255,255,.06); }
.wb .bx > span { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--cell); color: var(--text3); font-size: 5.4cqw; font-weight: 500; }
.wb .bx > span.m { background: var(--win-mine-bg); color: var(--accent-text); font-weight: 600; animation: fade .5s both; }
.win-head { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.win-head .chip { align-self: center; height: 26px; padding: 0 12px; font-size: 13px; }
.win-title { margin: 4px 0 0; font-size: 48px; line-height: 1; font-weight: 700; letter-spacing: -.05em; }
.bento { margin-top: 22px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.bento .tile { border-radius: 22px; padding: 16px 18px; }
.bento .tile.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 20px; }
.bento .tile.wide b { font-size: 38px; letter-spacing: -.03em; line-height: 1; }
.bento .tile span { font-size: 13px; }
.win-actions { padding-top: 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

/* sheet + toast */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: min(calc(100% - 20px), 460px); margin-bottom: calc(var(--safe-b) + 10px); padding: 16px; border-radius: 30px; background: rgba(30,31,36,.88); border: 1px solid var(--line); -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%); display: flex; flex-direction: column; gap: 8px; animation: up .32s cubic-bezier(.2,.8,.2,1); }
.sheet-title { padding: 2px 0 6px; text-align: center; font-size: 13px; color: var(--text2); }
.sheet-item { height: 56px; border-radius: 18px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 17px; font-weight: 500; transition: transform .15s; }
.sheet-item small { margin-left: auto; font-size: 13px; color: var(--text2); }
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 96px); z-index: 30; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 12px 18px; border-radius: 22px; background: rgba(40,41,46,.92); border: 1px solid var(--line); font-size: 14px; font-weight: 500; transition: opacity .25s, transform .25s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body data-screen="home">

<div class="glow" id="glowA" aria-hidden="true"></div>
<div class="glow" id="glowB" aria-hidden="true"></div>

<!-- HOME -->
<section class="screen" id="home">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>Midnight</div>
  <h1 class="title" id="homeTitle">Sudoku</h1>

  <div class="tab-panel" data-panel="play" role="tabpanel">
    <div class="panel-body">
      <button class="continue glass" id="continueBtn" hidden>
        <span class="cont-text">
          <span class="chip">In progress</span>
          <span><span class="cont-level" id="contLevel"></span><span class="cont-meta mono" id="contMeta"></span></span>
          <span class="progress"><i id="contBar"></i></span>
        </span>
        <span class="mini" id="contMini" aria-hidden="true"></span>
      </button>
      <div class="section-h" id="levelsHead"><h2>Difficulty</h2><span class="label">New game</span></div>
      <div class="levels" id="levels"></div>
      <div class="panel-foot">
        <button class="primary" id="playBtn"><span id="playLabel">Play</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
  <div class="tab-panel" data-panel="daily" role="tabpanel" hidden><div class="panel-body" id="dailyBody"></div></div>
  <div class="tab-panel" data-panel="stats" role="tabpanel" hidden><div class="panel-body" id="statsBody"></div></div>
  <div class="tab-panel" data-panel="settings" role="tabpanel" hidden><div class="panel-body" id="settingsBody"></div></div>

  <nav class="tabbar glass" role="tablist" aria-label="Main">
    <button role="tab" data-tab="play" aria-selected="true">

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const fmt = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(x).padStart(2, '0');
  return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
};
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('ms.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ms.' + k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } },
  del(k) { try { localStorage.removeItem('ms.' + k); } catch (e) { /* ignore */ } },
};
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(list, rnd) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) {
  const x = rgb(a), y = rgb(b);
  return '#' + x.map((v, i) => Math.round(v * t + y[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
}
const lum = (h) => { const [r, g, b] = rgb(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };

const ICON = {
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  pause: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
};

/* ---------- sudoku engine ---------- */
const LEVELS = {
  easy: { name: 'Easy', clues: 40, n: 1 },
  medium: { name: 'Medium', clues: 32, n: 2 },
  hard: { name: 'Hard', clues: 27, n: 3 },
  expert: { name: 'Expert', clues: 23, n: 4 },
};
const DAILY_LEVEL = 'medium';
const ACCENTS = [['White', '#F5F5F7'], ['Teal', '#3DD9C1'], ['Periwinkle', '#7C8CFF'], ['Orange', '#FF9F5A'], ['Gold', '#E2C08D']];

const ROW = [], COL = [], BOX = [], PEERS = [], UNITS = [];
for (let i = 0; i < 81; i++) {
  ROW[i] = Math.floor(i / 9);
  COL[i] = i % 9;
  BOX[i] = Math.floor(ROW[i] / 3) * 3 + Math.floor(COL[i] / 3);
}
for (let i = 0; i < 81; i++) {
  PEERS[i] = [];
  for (let j = 0; j < 81; j++) if (j !== i && (ROW[i] === ROW[j] || COL[i] === COL[j] || BOX[i] === BOX[j])) PEERS[i].push(j);
}
for (let k = 0; k < 9; k++) {
  UNITS.push([...Array(9).keys()].map((c) => k * 9 + c));
  UNITS.push([...Array(9).keys()].map((r) => r * 9 + k));
}
for (let b = 0; b < 9; b++) {
  const r0 = Math.floor(b / 3) * 3, c0 = (b % 3) * 3;
  UNITS.push([...Array(9).keys()].map((k) => (r0 + Math.floor(k / 3)) * 9 + c0 + (k % 3)));
}
const BOX_CELLS = UNITS.slice(18);
const POP = new Uint8Array(1024);
for (let m = 1; m < 1024; m++) POP[m] = POP[m >> 1] + (m & 1);

// Counts solutions up to `limit`; with `rnd`, tries digits in random order (used to build full grids).
function solve(grid, limit, rnd) {
  const g = Int8Array.from(grid);
  const rows = new Uint16Array(9), cols = new Uint16Array(9), boxes = new Uint16Array(9);
  for (let i = 0; i < 81; i++) {
    if (!g[i]) continue;
    const b = 1 << g[i];
    if ((rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & b) return { count: 0, first: null };
    rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b;
  }
  let count = 0, first = null;
  const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  (function search() {
    let best = -1, bestMask = 0, bestN = 10;
    for (let i = 0; i < 81; i++) {
      if (g[i]) continue;
      const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & 0x3FE;
      const n = POP[m];
      if (n < bestN) { best = i; bestMask = m; bestN = n; if (n <= 1) break; }
    }
    if (best < 0) { count++; if (!first) first = Array.from(g); return; }
    if (bestN === 0) return;
    const r = ROW[best], c = COL[best], x = BOX[best];
    for (const d of (rnd ? shuffle(digits, rnd) : digits)) {
      const b = 1 << d;
      if (!(bestMask & b)) continue;
      g[best] = d; rows[r] |= b; cols[c] |= b; boxes[x] |= b;
      search();
      g[best] = 0; rows[r] &= ~b; cols[c] &= ~b; boxes[x] &= ~b;
      if (count >= limit) return;
    }
  })();
  return { count, first };
}

// Builds a random full grid, then removes clues (symmetric pairs first) while the puzzle keeps one solution.
function generate(level, seed) {
  const rnd = mulberry32(seed);
  const sol = solve(Array(81).fill(0), 1, rnd).first;
  const puzzle = sol.slice();
  const target = LEVELS[level].clues;
  let clues = 81;
  const tryRemove = (list) => {
    const saved = list.map((i) => puzzle[i]);
    list.forEach((i) => { puzzle[i] = 0; });
    if (solve(puzzle, 2).count === 1) { clues -= list.length; return; }
    list.forEach((i, k) => { puzzle[i] = saved[k]; });
  };
  for (const i of shuffle([...Array(41).keys()], rnd)) {
    if (clues <= target) break;
    tryRemove(i === 40 ? [40] : [i, 80 - i]);
  }
  for (const i of shuffle([...Array(81).keys()], rnd)) {
    if (clues <= target) break;
    if (puzzle[i]) tryRemove([i]);
  }
  return { puzzle, sol };
}
const dateSeed = (key) => (Number(key.replace(/-/g, '')) * 2654435761) >>> 0;

/* ---------- state ---------- */
let settings = Object.assign({ accent: '#F5F5F7', glow: true, limit: true }, store.get('settings', {}));
let stats = Object.assign({ levels: {}, daily: {} }, store.get('stats', {}));
let uiLevel = LEVELS[store.get('level')] ? store.get('level') : 'medium';
let tab = 'play';
let current = 'home';
let game = null, slot = null, paused = false, lastWin = null;

const saveSettings = () => store.set('settings', settings);
const saveStats = () => store.set('stats', stats);
const save = () => { if (game && slot && !game.done) store.set('slot.' + slot, game); };
const levelStats = (id) => stats.levels[id] || (stats.levels[id] = { played: 0, won: 0, best: 0, total: 0 });
const val = (g, i) => g.puzzle[i] || g.entries[i];
const countFilled = (g) => { let n = 0; for (let i = 0; i < 81; i++) if (val(g, i)) n++; return n; };
const openSlot = (name) => { const g = store.get('slot.' + name); return g && !g.done ? g : null; };

function createGame(level, daily) {
  const { puzzle, sol } = generate(level, daily ? dateSeed(daily) : (Math.random() * 4294967296) >>> 0);
  return {
    level, daily: daily || null, puzzle, sol, counted: false,
    entries: Array(81).fill(0), notes: Array(81).fill(0),
    sel: null, notesMode: false, mistakes: 0, hints: 3, secs: 0,
    history: [], done: false, lost: false, unlimited: false,
  };
}

/* ---------- theme ---------- */
function applyTheme() {
  const A = settings.accent, light = lum(A) > 0.75, s = document.documentElement.style;
  s.setProperty('--accent', A);
  s.setProperty('--accent-soft', mix(A, '#060709', 0.18));
  s.setProperty('--accent-tile', mix(A, '#0B0C10', 0.14));
  s.setProperty('--accent-text', mix(A, '#FFFFFF', 0.7));
  s.setProperty('--accent-line', mix(A, '#0C0D12', 0.45));
  s.setProperty('--same', mix(A, '#0C0D12', 0.22));
  s.setProperty('--flash', mix(A, '#0C0D12', 0.42));
  s.setProperty('--win-mine-bg', mix(A, '#0C0D12', 0.16));
  s.setProperty('--wrong-bg', mix('#FF6B6B', '#0C0D12', 0.14));
  s.setProperty('--mine', light ? '#9AA3B2' : A);
  s.setProperty('--knob-on', light ? '#0A0B1A' : '#FFFFFF');
  document.body.classList.toggle('noglow', !settings.glow);
}

/* ---------- navigation ---------- */
function show(name) {
  for (const id of ['home', 'game', 'win']) {
    const el = $('#' + id);
    el.hidden = id !== name;
    if (id === name) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
  }
  current = name;
  document.body.dataset.screen = name;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}
const barsHTML = (n, small) => '<span class="bars' + (small ? ' sm' : '') + '" aria-hidden="true">' +
  (small ? [5, 8, 11, 14] : [6, 10, 14, 18]).map((hgt, k) => '<i class="' + (k < n ? 'on' : '') + '" style="height:' + hgt + 'px"></i>').join('') + '</span>';

/* ---------- home ---------- */
function setTab(t) {
  tab = t;
  $$('.tabbar button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  $$('.tab-panel').forEach((p) => { p.hidden = p.dataset.panel !== t; });
  renderHome();
}
function renderHome() {
  $('#homeTitle').textContent = { play: 'Sudoku', daily: 'Daily', stats: 'Statistics', settings: 'Settings' }[tab];
  if (tab === 'play') renderPlay();
  else if (tab === 'daily') renderDaily();
  else if (tab === 'stats') renderStats();
  else renderSettings();
}
function miniHTML(g) {
  return BOX_CELLS.map((box) => '<span class="bx">' + box.map((i) =>
    '<i class="' + (g.puzzle[i] ? 'g' : g.entries[i] && g.entries[i] === g.sol[i] ? 'm' : '') + '"></i>').join('') + '</span>').join('');
}
function renderPlay() {
  const g = openSlot('regular');
  $('#continueBtn').hidden = !g;
  $('#levelsHead').classList.toggle('first', !g);
  if (g) {
    const filled = countFilled(g);
    $('#contLevel').textContent = LEVELS[g.level].name;
    $('#contMeta').textContent = fmt(g.secs) + ' · ' + filled + '/81';
    $('#contBar').style.width = Math.round((filled / 81) * 100) + '%';
    $('#contMini').innerHTML = miniHTML(g);
  }
  $('#levels').innerHTML = Object.entries(LEVELS).map(([id, L]) =>
    '<button class="level glass" data-level="' + id + '" aria-pressed="' + (id === uiLevel) + '">' +
    '<span class="level-top">' + barsHTML(L.n) + '<span class="check">' + ICON.check + '</span></span>' +
    '<span class="level-name">' + L.name + '<small>~' + L.clues + ' clues</small></span></button>').join('');
  $('#playLabel').textContent = 'Play ' + LEVELS[uiLevel].name;
}
function dailyStreak() {
  const d = new Date();
  if (stats.daily[dayKey(d)] == null) d.setDate(d.getDate() - 1);
  let n = 0;
  while (stats.daily[dayKey(d)] != null) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderDaily() {
  const now = new Date(), key = dayKey(now);
  const solved = stats.daily[key];
  const saved = openSlot('daily');
  const inProgress = saved && saved.daily === key;
  const days = [];
  for (let k = 6; k >= 0; k--) { const d = new Date(now); d.setDate(now.getDate() - k); days.push(d); }
  const streak = dailyStreak();
  const status = solved != null ? 'Solved in ' + fmt(solved) + '. A fresh one arrives at midnight.'
    : inProgress ? 'In progress · ' + fmt(saved.secs)
    : 'One new puzzle every day, the same for everyone.';
  $('#dailyBody').innerHTML =
    '<div class="daily-card glass"><span class="chip">' + LEVELS[DAILY_LEVEL].name + ' · Daily</span>' +
    '<span class="daily-day">' + now.toLocaleDateString(undefined, { weekday: 'long' }) + '</span>' +
    '<span class="daily-date">' + now.toLocaleDateString(undefined, { month: 'long', day: 'numeric' }) + '</span>' +
    '<p class="label">' + status + '</p></div>' +
    '<div class="section-h"><h2>This week</h2><span class="label">Streak · ' + streak + (streak === 1 ? ' day' : ' days') + '</span></div>' +
    '<div class="week glass">' + days.map((d) => {
      const k = dayKey(d), done = stats.daily[k] != null;
      return '<span class="day' + (done ? ' done' : '') + (k === key ? ' today' : '') + '"><small>' +
        d.toLocaleDateString(undefined, { weekday: 'narrow' }) + '</small><b>' + (done ? ICON.check : d.getDate()) + '</b></span>';
    }).join('') + '</div>' +
    '<div class="panel-foot">' + (solved != null
      ? '<button class="secondary" disabled>Come back tomorrow</button>'
      : '<button class="primary" id="dailyBtn"><span>' + (inProgress ? 'Continue' : 'Play') + ' today’s puzzle</span>' + ICON.arrow + '</button>') + '</div>';
}
function renderStats() {
  let won = 0, played = 0;
  Object.values(stats.levels).forEach((l) => { won += l.won; played += l.played; });
  const streak = dailyStreak();
  $('#statsBody').innerHTML =
    '<div class="stat-tiles">' +
    '<div class="tile glass"><b class="mono">' + won + '</b><span>Solved</span></div>' +
    '<div class="tile glass"><b class="mono">' + (played ? Math.round((won / played) * 100) + '%' : '—') + '</b><span>Win rate</span></div>' +
    '<div class="tile glass"><b class="mono">' + streak + '</b><span>Daily streak</span></div></div>' +
    '<div class="section-h"><h2>By difficulty</h2></div>' +
    '<div class="group glass"><div class="srow head"><span style="text-align:left">Level</span><span>Solved</span><span>Best</span><span>Average</span></div>' +
    Object.entries(LEVELS).map(([id, L]) => {
      const s = levelStats(id);
      return '<div class="srow"><span class="sname">' + barsHTML(L.n, true) + L.name + '</span><b class="mono">' + s.won +
        '</b><b class="mono">' + (s.best ? fmt(s.best) : '—') + '</b><b class="mono">' + (s.won ? fmt(s.total / s.won) : '—') + '</b></div>';
    }).join('') + '</div>';
}
function renderSettings() {
  $('#settingsBody').innerHTML =
    '<div class="section-h first"><h2>Appearance</h2></div>' +
    '<div class="group glass"><div class="row"><span>Accent</span><span class="swatches" role="radiogroup" aria-label="Accent color">' +
    ACCENTS.map(([name, hex]) => '<button class="swatch" role="radio" aria-checked="' + (hex === settings.accent) + '" aria-label="' + name +
      '" data-accent="' + hex + '"><i style="background:' + hex + '"></i></button>').join('') + '</span></div>' +
    '<div class="row"><span>Background glow</span><button class="switch" role="switch" aria-label="Background glow" aria-checked="' + settings.glow + '" data-setting="glow"></button></div></div>' +
    '<div class="section-h"><h2>Gameplay</h2></div>' +
    '<div class="group glass"><div class="row"><span class="row-text">Mistake limit<small>The game ends after 3 mistakes</small></span>' +
    '<button class="switch" role="switch" aria-label="Mistake limit" aria-checked="' + settings.limit + '" data-setting="limit"></button></div></div>' +
    '<div class="group glass" style="margin-top:12px"><button class="row danger" id="resetStats">Reset statistics</button></div>' +
    '<p class="about">Midnight Sudoku 1.0 · Every puzzle has exactly one solution. Works offline once added to your Home Screen.</p>';
}

/* ---------- game ---------- */
const boardEl = $('#board'), padEl = $('#pad'), cells = [], keys = [];
for (const box of BOX_CELLS) {
  const bx = document.createElement('div');
  bx.className = 'box';
  for (const i of box) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.dataset.i = i;
    c.innerHTML = '<span class="v"></span><span class="notes" aria-hidden="true">' + '<span></span>'.repeat(9) + '</span>';
    c._v = c.firstChild;
    c._n = [...c.lastChild.children];
    c._fx = '';
    cells[i] = c;
    bx.appendChild(c);
  }
  boardEl.appendChild(bx);
}
for (let d = 1; d <= 9; d++) {
  const k = document.createElement('button');
  k.className = 'key glass';
  k.dataset.d = d;
  k.innerHTML = '<b>' + d + '</b><small></small>';
  keys.push(k);
  padEl.appendChild(k);
}

function candidates(i) {
  const used = new Set();
  for (const j of PEERS[i]) { const v = val(game, j); if (v) used.add(v); }
  return [1, 2, 3, 4, 5, 6, 7, 8, 9].filter((d) => !used.has(d));
}
function contextText() {
  const g = game, s = g.sel;
  if (g.done) return 'Solved';
  if (s == null) return 'Tap a cell to begin';
  let t = 'Row ' + (ROW[s] + 1) + ' · Column ' + (COL[s] + 1);
  if (g.puzzle[s]) t += ' · Given';
  else if (g.entries[s]) { if (g.entries[s] !== g.sol[s]) t += ' · Not quite'; }
  else { const n = candidates(s).length; t += ' · ' + n + (n === 1 ? ' candidate' : ' candidates'); }
  if (g.notesMode) t += ' · Notes on';
  return t;
}
function renderBoard() {
  const g = game, s = g.sel, sv = s != null ? val(g, s) : 0;
  for (let i = 0; i < 81; i++) {
    const c = cells[i], v = val(g, i), given = !!g.puzzle[i];
    const wrong = !given && v && v !== g.sol[i];
    let cls = 'cell';
    if (given) cls += ' given'; else if (v) cls += wrong ? ' wrong' : ' mine';
    if (i === s) cls += ' sel';
    else if (v && v === sv) cls += ' same';
    else if (wrong) cls += ' wrongbg';
    else if (s != null && (ROW[i] === ROW[s] || COL[i] === COL[s] || BOX[i] === BOX[s])) cls += ' rel';
    if (c._fx) cls += ' ' + c._fx;
    c.className = cls;
    c._v.textContent = v || '';
    const notes = v ? 0 : g.notes[i];
    for (let k = 0; k < 9; k++) {
      const on = notes & (1 << (k + 1));
      c._n[k].textContent = on ? k + 1 : '';
      c._n[k].className = on && sv === k + 1 ? 'hl' : '';
    }
    c.setAttribute('aria-label', 'Row ' + (ROW[i] + 1) + ', column ' + (COL[i] + 1) + ', ' + (v ? v : 'empty'));
  }
}
function renderGame() {
  const g = game, L = LEVELS[g.level];
  $('#pillName').textContent = g.daily ? 'Daily' : L.name;
  $('#pillBars').innerHTML = barsHTML(L.n, true);
  const m = $('#mistakes');
  m.textContent = settings.limit && !g.unlimited ? g.mistakes + '/3' : String(g.mistakes);
  m.classList.toggle('bad', g.mistakes > 0);
  $('#time').textContent = fmt(g.secs);
  $('#filled').textContent = countFilled(g) + '/81';
  renderBoard();
  const placed = Array(10).fill(0);
  for (let i = 0; i < 81; i++) { const v = val(g, i); if (v && v === g.sol[i]) placed[v]++; }
  keys.forEach((k, idx) => {
    const left = 9 - placed[idx + 1];
    k.lastChild.textContent = left > 0 ? left : '';
    k.classList.toggle('done', left <= 0);
    k.setAttribute('aria-label', (g.notesMode ? 'Note ' : 'Place ') + (idx + 1) + ', ' + left + ' left');
  });
  padEl.classList.toggle('notes', g.notesMode);
  $('#notesBtn').setAttribute('aria-pressed', String(g.notesMode));
  $('#notesLabel').textContent = g.notesMode ? 'Notes on' : 'Notes';
  $('#hintBadge').textContent = g.hints;
  $('#hintBtn').disabled = g.hints <= 0;
  $('#pauseBtn').innerHTML = paused ? ICON.play : ICON.pause;
  $('#pauseBtn').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  $('#pauseOverlay').hidden = !paused || g.lost;
  $('#pauseTime').textContent = fmt(g.secs);
  $('#lostOverlay').hidden = !g.lost;
  $('#context').textContent = contextText();
}

const canPlay = () => game && !game.done && !game.lost && !paused;
const isSolved = () => { for (let i = 0; i < 81; i++) if (val(game, i) !== game.sol[i]) return false; return true; };
const locked = (i) => !!game.puzzle[i] || (game.entries[i] && game.entries[i] === game.sol[i]);
function pushHistory() {
  // A game counts as played from its first move, so opening and abandoning one doesn't hurt the win rate.
  if (!game.counted) { game.counted = true; levelStats(game.level).played++; saveStats(); }
  game.history.push([game.entries.slice(), game.notes.slice()]);
  if (game.history.length > 100) game.history.shift();
}
function commit() { save(); renderGame(); }
function addFx(i, name, delay) {
  const c = cells[i];
  if (!c._fx.includes(name)) c._fx = (c._fx + ' ' + name).trim();
  if (delay != null) c.style.animationDelay = delay + 'ms';
}
function flashFrom(i, list) {
  list.forEach((j) => addFx(j, 'flash', (Math.abs(ROW[j] - ROW[i]) + Math.abs(COL[j] - COL[i])) * 40));
}
function checkUnits(i) {
  const hit = new Set();
  for (const u of UNITS) if (u.includes(i) && u.every((j) => val(game, j) === game.sol[j])) u.forEach((j) => hit.add(j));
  flashFrom(i, [...hit]);
}
function placeCorrect(i, d) {
  game.entries[i] = d;
  game.notes[i] = 0;
  for (const j of PEERS[i]) game.notes[j] &= ~(1 << d);
  addFx(i, 'pop');
  if (isSolved()) { finish(i); return; }
  checkUnits(i);
  commit();
}
function select(i) {
  if (!game || game.done || paused) return;
  game.sel = i;
  renderGame();
}
function input(d) {
  if (!canPlay()) return;
  const g = game, i = g.sel;
  if (i == null || locked(i)) return;
  if (g.notesMode) {
    if (g.entries[i]) return;
    pushHistory();
    g.notes[i] ^= 1 << d;
    commit();
    return;
  }
  pushHistory();
  if (g.entries[i] === d) { g.entries[i] = 0; commit(); return; }
  if (d === g.sol[i]) { placeCorrect(i, d); return; }
  g.entries[i] = d;
  g.notes[i] = 0;
  g.mistakes++;
  addFx(i, 'pop');
  if (settings.limit && !g.unlimited && g.mistakes >= 3) g.lost = true;
  commit();
}
function erase() {
  if (!canPlay()) return;
  const i = game.sel;
  if (i == null || locked(i) || (!game.entries[i] && !game.notes[i])) return;
  pushHistory();
  game.entries[i] = 0;
  game.notes[i] = 0;
  commit();
}
function undo() {
  if (!canPlay() || !game.history.length) return;
  const [entries, notes] = game.history.pop();
  game.entries = entries;
  game.notes = notes;
  commit();
}
function hint() {
  if (!canPlay() || game.hints <= 0) return;
  const g = game, open = (j) => j != null && !g.puzzle[j] && g.entries[j] !== g.sol[j];
  let i = g.sel;
  if (!open(i)) {
    i = null;
    let best = 10;
    for (let j = 0; j < 81; j++) if (open(j)) { const n = candidates(j).length; if (n < best) { best = n; i = j; } }
  }
  if (i == null) return;
  pushHistory();
  g.hints--;
  g.sel = i;
  placeCorrect(i, g.sol[i]);
}
function toggleNotes() {
  if (!canPlay()) return;
  game.notesMode = !game.notesMode;
  renderGame();
}
function setPaused(p) {
  if (!game || game.done) return;
  paused = p;
  save();
  renderGame();
}
function finish(i) {
  const g = game;
  g.done = true;
  g.sel = null;
  const s = levelStats(g.level);
  const best = !s.best || g.secs < s.best;
  s.won++;
  s.total += g.secs;
  if (best) s.best = g.secs;
  if (g.daily) stats.daily[g.daily] = g.secs;
  saveStats();
  store.del('slot.' + slot);
  lastWin = { game: g, best, first: s.won === 1 };
  flashFrom(i, [...Array(81).keys()]);
  renderGame();
  setTimeout(showWin, 1150);
}

function openGame() {
  paused = false;
  cells.forEach((c) => { c._fx = ''; c.style.animationDelay = ''; });
  show('game');
  renderGame();
}
function startRegular(level) {
  const existing = openSlot('regular');
  if (existing && existing.entries.some(Boolean) &&
      !confirm('Start a new ' + LEVELS[level].name + ' game? Your current game will be lost.')) return;
  uiLevel = level;
  store.set('level', level);
  game = createGame(level);
  slot = 'regular';
  save();
  openGame();
}
function resume(name) {
  const g = openSlot(name);
  if (!g) return;
  game = g;
  slot = name;
  openGame();
}
function playDaily() {
  const key = dayKey();
  const saved = openSlot('daily');
  if (saved && saved.daily === key) { resume('daily'); return; }
  if (stats.daily[key] != null) return;
  game = createGame(DAILY_LEVEL, key);
  slot = 'daily';
  save();
  openGame();
}
function restart() {
  Object.assign(game, { entries: Array(81).fill(0), notes: Array(81).fill(0), sel: null, notesMode: false, mistakes: 0, hints: 3, secs: 0, history: [], lost: false, unlimited: false });
  openGame();
  save();
}
function goHome() {
  save();
  show('home');
  renderHome();
}

/* ---------- win ---------- */
function showWin() {
  if (!lastWin) return;
  const g = lastWin.game, L = LEVELS[g.level];
  let order = 0;
  $('#winBoard').innerHTML = BOX_CELLS.map((box) => '<span class="bx">' + box.map((i) => g.puzzle[i]
    ? '<span>' + g.sol[i] + '</span>'
    : '<span class="m" style="animation-delay:' + (order++ * 12) + 'ms">' + g.sol[i] + '</span>').join('') + '</span>').join('');
  $('#winChip').textContent = (g.daily ? 'Daily · ' : '') + L.name + ' · Complete';
  $('#winSub').textContent = lastWin.first ? 'Your first ' + L.name + ' solve.'
    : lastWin.best ? 'New personal best for ' + L.name + '.'
    : 'Every row, column and box in place.';
  $('#winTime').textContent = fmt(g.secs);
  $('#winMistakes').textContent = g.mistakes;
  $('#winHints').textContent = 3 - g.hints;
  show('win');
}
async function shareWin() {
  if (!lastWin) return;
  const g = lastWin.game;
  const text = 'Midnight Sudoku · ' + (g.daily ? 'Daily ' + g.daily : LEVELS[g.level].name) + ' solved in ' + fmt(g.secs) +
    ' with ' + g.mistakes + (g.mistakes === 1 ? ' mistake.' : ' mistakes.');
  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  } catch (e) { /* share sheet dismissed */ }
}

/* ---------- sheet ---------- */
function openSheet() {
  $('#sheetList').innerHTML = Object.entries(LEVELS).map(([id, L]) =>
    '<button class="sheet-item" data-level="' + id + '">' + barsHTML(L.n) + L.name + '<small>~' + L.clues + ' clues</small></button>').join('') +
    '<button class="sheet-item" data-restart="1">Restart this puzzle</button>';
  $('#sheet').hidden = false;
}
const closeSheet = () => { $('#sheet').hidden = true; };

/* ---------- events ---------- */
$('.tabbar').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#levels').addEventListener('click', (e) => {
  const b = e.target.closest('[data-level]');
  if (!b) return;
  uiLevel = b.dataset.level;
  store.set('level', uiLevel);
  renderPlay();
});
$('#playBtn').addEventListener('click', () => startRegular(uiLevel));
$('#continueBtn').addEventListener('click', () => resume('regular'));
$('#dailyBody').addEventListener('click', (e) => { if (e.target.closest('#dailyBtn')) playDaily(); });
$('#settingsBody').addEventListener('click', (e) => {
  const sw = e.target.closest('[data-accent]');
  const tg = e.target.closest('[data-setting]');
  if (sw) settings.accent = sw.dataset.accent;
  else if (tg) settings[tg.dataset.setting] = !settings[tg.dataset.setting];
  else if (e.target.closest('#resetStats')) {
    if (!confirm('Reset all statistics? This cannot be undone.')) return;
    stats = { levels: {}, daily: {} };
    saveStats();
    toast('Statistics reset');
  } else return;
  saveSettings();
  applyTheme();
  renderSettings();
});

boardEl.addEventListener('click', (e) => { const c = e.target.closest('.cell'); if (c) select(+c.dataset.i); });
boardEl.addEventListener('animationend', (e) => {
  const c = e.target.closest('.cell');
  if (!c) return;
  const name = e.animationName === 'flash' ? 'flash' : 'pop';
  c._fx = c._fx.split(' ').filter((x) => x && x !== name).join(' ');
  c.classList.remove(name);
  if (name === 'flash') c.style.animationDelay = '';
});
padEl.addEventListener('click', (e) => { const k = e.target.closest('.key'); if (k) input(+k.dataset.d); });
$('#undoBtn').addEventListener('click', undo);
$('#eraseBtn').addEventListener('click', erase);
$('#notesBtn').addEventListener('click', toggleNotes);
$('#hintBtn').addEventListener('click', hint);
$('#pauseBtn').addEventListener('click', () => setPaused(!paused));
$('#resumeBtn').addEventListener('click', () => setPaused(false));
$('#backBtn').addEventListener('click', goHome);
$('#levelPill').addEventListener('click', openSheet);
$('#keepBtn').addEventListener('click', () => { game.lost = false; game.unlimited = true; commit(); });
$('#retryBtn').addEventListener('click', () => { if (slot === 'daily') restart(); else { store.del('slot.regular'); startRegular(game.level); } });
$('#sheetCancel').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) { closeSheet(); return; }
  const b = e.target.closest('.sheet-item');
  if (!b) return;
  closeSheet();
  if (b.dataset.restart) restart(); else startRegular(b.dataset.level);
});
$('#winClose').addEventListener('click', () => { show('home'); renderHome(); });
$('#winHome').addEventListener('click', () => { show('home'); renderHome(); });
$('#winNext').addEventListener('click', () => startRegular(lastWin ? lastWin.game.level : uiLevel));
$('#winShare').addEventListener('click', shareWin);

document.addEventListener('keydown', (e) => {
  if (current !== 'game' || !game || e.altKey) return;
  const s = game.sel == null ? 40 : game.sel;
  if (e.key >= '1' && e.key <= '9' && !e.metaKey && !e.ctrlKey) input(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
  else if (e.key === 'ArrowUp') select(s >= 9 ? s - 9 : s + 72);
  else if (e.key === 'ArrowDown') select(s < 72 ? s + 9 : s - 72);
  else if (e.key === 'ArrowLeft') select(s % 9 ? s - 1 : s + 8);
  else if (e.key === 'ArrowRight') select(s % 9 < 8 ? s + 1 : s - 8);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'z' && (e.metaKey || e.ctrlKey)) undo();
  else if (e.key === ' ') setPaused(!paused);
  else return;
  e.preventDefault();
});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && current === 'game' && game && !game.done) setPaused(true);
});
window.addEventListener('pagehide', save);

setInterval(() => {
  if (current !== 'game' || !game || paused || game.done || game.lost || document.visibilityState !== 'visible') return;
  game.secs++;
  $('#time').textContent = fmt(game.secs);
  if (game.secs % 5 === 0) save();
}, 1000);

/* ---------- boot ---------- */
applyTheme();
renderHome();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
}
})();
</script>
</body>
</html>
